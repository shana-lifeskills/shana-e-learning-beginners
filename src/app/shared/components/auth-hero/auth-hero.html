<div class="hero-panel">
  <div class="hero-brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 5.5c2-1 5-1 8 0v13c-3-1-6-1-8 0v-13z" stroke-linejoin="round" /><path d="M20 5.5c-2-1-5-1-8 0v13c3-1 6-1 8 0v-13z" stroke-linejoin="round" /></svg>
    </span>
    <span class="brand-name">ShanaLifeSkills</span>
  </div>

  <div class="hero-illustration">
    <img [src]="heroImage()" alt="Illustration of learners on ShanaLifeSkills" />
    <span class="floaty-pill pill-1">{{ streakPillText() }}</span>
    <span class="floaty-pill pill-2">{{ adventurePillText() }}</span>
  </div>

  <div class="hero-copy">
    <p class="tagline">{{ tagline() }}</p>
    <h2>{{ headline() }}</h2>
  </div>
</div>
