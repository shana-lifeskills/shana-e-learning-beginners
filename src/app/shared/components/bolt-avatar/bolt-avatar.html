<div class="bolt" [ngClass]="moodClass()" [style.width.px]="size()" [style.height.px]="size() * 1.077">
  @if (mood() === 'cheer') {
    <div class="confetti">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
  }

  <svg class="bolt-svg" viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <ellipse class="shadow" cx="70" cy="142" rx="34" ry="6" />

    <line class="antenna-rod" x1="70" y1="8" x2="70" y2="26" />
    <circle class="antenna-ball" cx="70" cy="8" r="7" />

    <rect class="ear ear-left" x="8" y="58" width="12" height="26" rx="6" />
    <rect class="ear ear-right" x="120" y="58" width="12" height="26" rx="6" />

    <path class="arm arm-left" d="M28 88 Q10 96 14 118" />
    <path class="arm arm-right" d="M112 88 Q130 96 126 118" />

    <rect class="body" x="24" y="26" width="92" height="98" rx="34" />

    <g class="face">
      <ellipse class="eye eye-left" cx="52" cy="70" rx="9" ry="11" />
      <ellipse class="eye eye-right" cx="88" cy="70" rx="9" ry="11" />
      <circle class="cheek cheek-left" cx="40" cy="84" r="6" />
      <circle class="cheek cheek-right" cx="100" cy="84" r="6" />

      @switch (mood()) {
        @case ('cheer') {
          <path class="mouth" d="M48 92 Q70 116 92 92 Q70 106 48 92 Z" />
        }
        @case ('thinking') {
          <path class="mouth" d="M52 96 Q70 90 88 96" />
        }
        @case ('oops') {
          <ellipse class="mouth mouth-oops" cx="70" cy="97" rx="7" ry="6" />
        }
        @default {
          <path class="mouth" d="M50 90 Q70 108 90 90" />
        }
      }
    </g>
  </svg>
</div>
