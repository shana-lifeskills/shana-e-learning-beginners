<div class="paystack-overlay" (click)="close()">
  <div class="paystack-modal" (click)="$event.stopPropagation()">
    @switch (step()) {
      @case ('details') {
        <div class="paystack-header">
          <span class="merchant">ShanaLifeSkills Centre</span>
          <button type="button" class="close-btn" (click)="close()" aria-label="Close payment window">✕</button>
        </div>

        <div class="amount-block">
          <span class="amount-label">Amount</span>
          <span class="amount-value">₦{{ amountNaira }}</span>
        </div>

        <div class="field-block">
          <label>Email address</label>
          <input type="email" [value]="email()" disabled />
        </div>

        <div class="field-block">
          <label>Card number</label>
          <input type="text" placeholder="0000 0000 0000 0000" disabled />
        </div>

        <div class="field-row">
          <div class="field-block">
            <label>Expiry</label>
            <input type="text" placeholder="MM / YY" disabled />
          </div>
          <div class="field-block">
            <label>CVV</label>
            <input type="text" placeholder="•••" disabled />
          </div>
        </div>

        <button type="button" class="pay-btn" (click)="pay()">Pay ₦{{ amountNaira }}</button>

        <p class="paystack-footer">🔒 Secured by <strong>Paystack</strong> — demo checkout, no card is charged.</p>
      }
      @case ('processing') {
        <div class="status-view">
          <div class="spinner"></div>
          <p>Confirming your payment…</p>
        </div>
      }
      @case ('success') {
        <div class="status-view success">
          <div class="check-circle">✓</div>
          <p>Payment successful!</p>
          <p class="status-sub">Unlocking your modules…</p>
        </div>
      }
    }
  </div>
</div>
