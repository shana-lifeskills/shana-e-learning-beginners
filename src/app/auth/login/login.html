<div class="auth-page">
  <div class="auth-form-panel">
    <div class="auth-card">
      <a routerLink="/welcome" class="back-link">← Back</a>

      <div class="auth-tabs">
        <a routerLink="/signup">Create account</a>
        <a routerLink="/login" class="active">Log in</a>
      </div>

      <div class="eyebrow">✨ Welcome back</div>
      <h1>Good to see you again!</h1>
      <p class="subtitle">Log in to keep your learning adventure going.</p>

      @if (errorMessage()) {
        <app-friendly-alert [message]="errorMessage()" icon="🤔" />
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="mt-3">
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input id="email" type="email" class="form-control" formControlName="email" placeholder="you@example.com" autocomplete="email" />
        </div>

        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <div class="password-field">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              class="form-control"
              formControlName="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <button type="button" class="toggle-visibility" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
              {{ showPassword() ? '🙈' : '👁️' }}
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-lg-tappable" [disabled]="submitting()">
          @if (submitting()) { Logging in… } @else { Log In → }
        </button>
      </form>

      <p class="signup-link">
        New here?
        <a routerLink="/welcome">Create an account</a>
      </p>

      <div class="demo-hint">
        <strong>Try a demo account:</strong>
        <span>Learner: ava&#64;shana.dev / ava123</span>
        <span>Trainer: trainer&#64;shana.dev / trainer123</span>
      </div>
    </div>
  </div>

  <app-auth-hero />
</div>
