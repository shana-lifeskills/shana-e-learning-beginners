<div class="auth-page">
  <div class="auth-form-panel">
    <div class="auth-card">
      <div class="auth-tabs">
        <a routerLink="/login" class="active">Sign in</a>
        <a routerLink="/signup" [queryParams]="{ accountType: accountType() }">Create account</a>
      </div>

      <h1>Sign in to ShanaLifeSkills</h1>
      <p class="subtitle">Pick up right where you left off.</p>

      @if (errorMessage()) {
        <app-friendly-alert [message]="errorMessage()" icon="🤔" />
      }

      <app-account-type-picker heading="I'm signing in as a..." [selected]="accountType()" (selectedChange)="chooseAccountType($event)" />

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-2">
          <label class="form-label" for="email">Email</label>
          <input id="email" type="email" class="form-control" formControlName="email" placeholder="you@shanalifeskills.school" autocomplete="email" />
        </div>

        <div class="mb-2">
          <label class="form-label" for="password">Password</label>
          <div class="password-field">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              class="form-control"
              formControlName="password"
              placeholder="Enter your password"
              autocomplete="current-password"
            />
            <button type="button" class="toggle-visibility" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
              {{ showPassword() ? '🙈' : '👁️' }}
            </button>
          </div>
        </div>

        <div class="form-meta-row mb-3">
          <label class="remember-me">
            <input type="checkbox" />
            Remember me
          </label>
          <button type="button" class="link-btn" (click)="forgotPassword()">Forgot password?</button>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-lg-tappable" [disabled]="submitting()">
          @if (submitting()) { Signing in… } @else { {{ ctaLabel() }} → }
        </button>
      </form>

      <p class="signup-link">
        New to ShanaLifeSkills?
        <a routerLink="/signup" [queryParams]="{ accountType: accountType() }">Create an account</a>
      </p>
    </div>
  </div>

  <app-auth-hero [variant]="accountType()" />
</div>
