<div class="hcl">
  <span class="hcl-badge">{{ step().badge }}</span>
  <span class="hcl-week">{{ step().weekLabel }}</span>

  <div class="hcl-medal" [class.lit]="saidIt()">
    <span class="hcl-rays" aria-hidden="true"></span>
    <span class="hcl-soap">
      <span class="hcl-bubble" aria-hidden="true"></span>
      <p class="hcl-statement">{{ step().statement }}</p>
    </span>
  </div>

  <div class="hcl-say">
    <span class="hcl-say-label">{{ step().sayItLabel }}</span>
    <button
      type="button"
      class="hcl-say-btn"
      [class.done]="saidIt()"
      [disabled]="saidIt()"
      (click)="toggleSaidIt()"
    >
      {{ saidIt() ? '✓ ' + step().saidItLabel : step().saidItLabel }}
    </button>
  </div>

  <p class="hcl-reinforce">{{ step().reinforceLine }}</p>

  <button type="button" class="hcl-complete" [disabled]="!saidIt()" (click)="finish()">
    {{ step().completeLabel }} 🎉
  </button>
  @if (!saidIt()) {
    <p class="hcl-hint">Say the sentence out loud, then tap the button above.</p>
  }
</div>
