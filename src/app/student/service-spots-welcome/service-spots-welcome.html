<div class="ssw">
  <span class="ssw-week">{{ ssw.weekLabel }}</span>

  <h1>
    <span class="ssw-title-start">{{ ssw.titleStart }}</span>
    <span class="ssw-title-accent">{{ ssw.titleAccent }}</span>
  </h1>

  <div class="ssw-scene" aria-hidden="true">
    <svg viewBox="0 0 260 150" role="img">
      <line class="ssw-ground" x1="10" y1="132" x2="250" y2="132" />

      <!-- house -->
      <g class="ssw-house">
        <rect x="24" y="86" width="66" height="46" rx="3" />
        <polygon points="20,88 57,54 94,88" />
        <rect class="ssw-door" x="48" y="104" width="18" height="28" rx="2" />
        <rect class="ssw-win" x="30" y="94" width="12" height="12" rx="2" />
        <rect class="ssw-win" x="72" y="94" width="12" height="12" rx="2" />
      </g>

      <!-- school -->
      <g class="ssw-school">
        <rect x="168" y="78" width="76" height="54" rx="3" />
        <polygon points="168,78 206,52 244,78" />
        <rect class="ssw-flag-pole" x="205" y="30" width="2" height="24" />
        <polygon class="ssw-flag" points="207,30 224,36 207,42" />
        <rect class="ssw-door" x="197" y="102" width="18" height="30" rx="2" />
        <rect class="ssw-win" x="176" y="90" width="12" height="12" rx="2" />
        <rect class="ssw-win" x="224" y="90" width="12" height="12" rx="2" />
      </g>

      <!-- path of hearts -->
      <g class="ssw-path">
        @for (h of [0, 1, 2, 3]; track h) {
          <path class="ssw-heart" [style.animation-delay]="(h * 0.25) + 's'"
            [attr.transform]="'translate(' + (104 + h * 15) + ' ' + (124 - (h % 2) * 6) + ') scale(0.5)'"
            d="M0 4 c-5 -9 -19 -7 -19 4 c0 9 11 15 19 21 c8 -6 19 -12 19 -21 c0 -11 -14 -13 -19 -4 z" />
        }
      </g>
    </svg>
    <div class="ssw-marks">
      <span class="ssw-mark">{{ ssw.homeLabel }}</span>
      <span class="ssw-mark">{{ ssw.schoolLabel }}</span>
    </div>
  </div>

  <div class="ssw-objective">
    <span class="ssw-objective-label">{{ ssw.objectiveLabel }}</span>
    <p>{{ ssw.objectiveText }}</p>
  </div>

  @if (isCompletedLessonWelcome()) {
    @if (nextLesson(); as next) {
      <button type="button" class="ssw-start" (click)="continueToNextLesson()">Continue to Week {{ next.week }} →</button>
    } @else {
      <button type="button" class="ssw-start" (click)="backToMap()">Back to My Modules →</button>
    }
    <button type="button" class="ssw-review" (click)="beginLesson()">↺ Review this lesson</button>
  } @else {
    <button type="button" class="ssw-start" (click)="beginLesson()">{{ ssw.startLabel }} →</button>
  }

  <p class="ssw-footer">{{ ssw.footerNote }}</p>
</div>
