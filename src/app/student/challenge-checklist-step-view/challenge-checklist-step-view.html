<div class="challenge-checklist">
  <span class="badge">{{ step().badge }}</span>
  <h1>{{ step().heading }}</h1>
  <p class="subtitle">{{ step().subtitle }}</p>

  <div class="items-grid">
    @for (item of step().items; track item.id) {
      <button type="button" class="item-card" [class.done]="isDone(item.id)" (click)="toggle(item.id)">
        @if (isDone(item.id)) { <span class="done-check">✓</span> }
        <span class="item-icon">{{ item.icon }}</span>
        <strong>{{ item.title }}</strong>
        <p>{{ item.description }}</p>
      </button>
    }
  </div>

  <div class="progress-track">
    <div class="progress-fill" [style.width.%]="progressPercent()"></div>
  </div>
  <p class="progress-label">{{ doneCount() }} of {{ step().items.length }} steps done</p>

  <button type="button" class="btn btn-primary btn-lg-tappable" (click)="continued.emit()">
    {{ step().continueLabel }}
  </button>
  <p class="tip">{{ step().tip }}</p>
</div>
